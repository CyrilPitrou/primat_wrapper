[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "primat_wrapper"
version = "0.1.0"
description = "Cobaya theory+likelihood wrapper for the PRIMAT / PyPRIMAT BBN codes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cyril Pitrou", email = "cyril.pitrou@pm.me" }]
dependencies = [
    "cobaya",
    "numpy",
    "scipy",
]

[tool.setuptools]
# The importable package is `primat_wrapper/`. The bundled PyPRIMAT solver
# (and the user-supplied PRIMAT Mathematica code) live at the repository root
# and are located at run time relative to it; they are intentionally NOT part
# of the installed wheel. Install in editable mode (`pip install -e .`) so the
# repository tree — including PRIMAT/ and PyPRIMAT/ and their data files —
# stays in place where the wrapper expects it.
packages = ["primat_wrapper"]

[tool.setuptools.package-data]
# Ship the LaTeX-label default YAMLs alongside the classes so Cobaya can read
# PrimatTheory.yaml / PrimatLikelihood.yaml via importlib.resources.
primat_wrapper = ["*.yaml"]
