[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "primat_cobaya"
version = "0.1.0"
description = "Cobaya theory+likelihood wrapper for the PyPRIMAT BBN code"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cyril Pitrou", email = "cyril.pitrou@pm.me" }]
dependencies = [
    "cobaya",
    "numpy",
    "scipy",
]

[tool.setuptools]
# The importable package is `primat_cobaya/`. The bundled PyPRIMAT solver
# lives at the repository root and is located at run time relative to it; it
# is intentionally NOT part of the installed wheel. Install in editable mode
# (`pip install -e .`) so the repository tree — including PyPRIMAT/ and its
# data files — stays in place where the wrapper expects it.
packages = ["primat_cobaya"]

[tool.setuptools.package-data]
# Ship the LaTeX-label default YAMLs alongside the classes so Cobaya can read
# PrimatTheory.yaml / PrimatLikelihood.yaml via importlib.resources.
primat_cobaya = ["*.yaml", "data/*.dat"]
