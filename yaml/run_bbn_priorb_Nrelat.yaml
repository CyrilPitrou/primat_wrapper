# run_bbn.yaml
# ------------
# Cobaya run configuration: PrimatTheory + PrimatLikelihood.
#
# Key design points
# -----------------
# • YHe and DH are declared in the global params block WITHOUT a prior.
#   That is how Cobaya recognises them as derived parameters.
# • PrimatTheory writes them into state["derived"] inside calculate().
# • Cobaya automatically injects them as keyword arguments to logp().
# • No output_params, no must_provide, no get_YHe/get_DH required.

# ── Theory ───────────────────────────────────────────────────────────────────
theory:
  primat_wrapper.primat_theory.PrimatTheory:
#    # No python_path needed: installed via `pip install -e .`
#    PRIMAT_PATH: "PRIMAT"
#    MathKernelCommand: "math13"
    ReducedNetwork: True
    Verbose: False
    fEDE:   0.0      # set to null to vary
    zcEDE:  1.0e8    # set to null to vary
    wnEDE:  1.0
    DeltaNeff: null      # set to null to vary

# ── Likelihood ───────────────────────────────────────────────────────────────
likelihood:
  primat_wrapper.primat_likelihood.PrimatLikelihood:
#    # No python_path needed: installed via `pip install -e .`
    YHe_mean:         0.2458
    YHe_sigma:        0.0013
    YHe_PRIMAT_sigma: 0.0001091146
    DH_mean:          2.527e-5
    DH_sigma:         0.030e-5
    DH_PRIMAT_sigma:  2.754096e-7

# ── Parameters ───────────────────────────────────────────────────────────────
params:

  # Sampled parameter
  omegabh2:
    prior:
      dist: norm
      loc:   0.02285
      scale: 0.00016
    ref:
      dist: norm
      loc:   0.02285
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_b h^2

  DeltaNeff:
    prior:
      min: -2.0
      max: 2.0
    ref:
      dist: norm
      loc: 0.0
      scale: 0.1
    proposal: 0.05
    latex: N_\mathrm{relat} 

  # Derived parameters — NO prior block = Cobaya treats them as derived.
  # PrimatTheory writes these into state["derived"]; Cobaya routes them
  # to logp(YHe, DH, ...) automatically.
  YHe:
    latex: Y_p
  DH:
    latex: ({\rm D/H})

  # ── Optional: uncomment to vary EDE parameters ──────────────────────────
  # fEDE:
  #   prior:  {min: 0.0, max: 0.2}
  #   ref:    {dist: norm, loc: 0.05, scale: 0.01}
  #   proposal: 0.005
  #   latex: f_{\rm EDE}
  #
  # zcEDE:
  #   prior:  {min: 1.0e3, max: 1.0e9}
  #   ref:    {dist: norm, loc: 1.0e5, scale: 1.0e4}
  #   proposal: 5.0e3
  #   latex: z_c^{\rm EDE}

# ── Sampler ──────────────────────────────────────────────────────────────────
# Sampler: MCMC
sampler:
  mcmc:
    max_samples: 50000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    learn_proposal: True
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    output_every: 10s

# ── Output ───────────────────────────────────────────────────────────────────
output: chains/bbn_priorb_DeltaNeff
resume: True